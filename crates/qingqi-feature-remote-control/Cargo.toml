qingqi-core = { path = "../qingqi-core" }
qingqi-platform = { path = "../qingqi-platform" }
qingqi-plugin = { path = "../qingqi-plugin" }
qingqi-ui = { path = "../qingqi-ui" }
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
time.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing.workspace = true
uuid.workspace = true
dirs = "6.0"
mime_guess = "2.0"
